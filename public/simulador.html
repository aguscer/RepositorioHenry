<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simulador de WhatsApp</title>
  <link rel="stylesheet" href="/estilos.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
  <style>
    .telefono { max-width: 460px; margin: 24px auto; background: var(--panel); border: 1px solid var(--borde); border-radius: 16px; display: flex; flex-direction: column; height: calc(100vh - 48px); }
    .telefono header { padding: 14px 16px; border-bottom: 1px solid var(--borde); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .telefono .charla { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .telefono .redactar { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--borde); }
    .telefono input[type=text] { flex: 1; background: var(--fondo); border: 1px solid var(--borde); border-radius: 999px; padding: 11px 14px; color: var(--texto); }
    .telefono .redactar button { border: none; border-radius: 999px; background: var(--acento); color: #1a1206; font-weight: 700; padding: 0 18px; }
    .sugerencias { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 12px 10px; }
    .sugerencias button { border: 1px solid var(--borde); background: transparent; color: var(--suave); border-radius: 999px; padding: 5px 11px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="telefono">
    <header>
      <div>
        <strong>Simulador de cliente</strong>
        <div class="cliente">Probá el bot sin conectar WhatsApp</div>
      </div>
      <input type="text" id="telefono" value="5491100000000" style="width:150px;font-size:12px" title="Número del cliente simulado" />
    </header>

    <div class="charla" id="charla">
      <div class="burbuja bot"><span class="quien">bot</span>Escribí un mensaje como si fueras un cliente. Probá con <b>hola</b>, <b>¿a qué hora abren?</b> o <b>quiero pedir</b>.</div>
    </div>

    <div class="sugerencias">
      <button>hola</button>
      <button>menú</button>
      <button>¿hacen delivery?</button>
      <button>quiero pedir</button>
      <button>2 muzzarella y una coca</button>
      <button>listo</button>
      <button>hablar con alguien</button>
    </div>

    <div class="redactar">
      <input type="text" id="mensaje" placeholder="Escribí un mensaje…" autocomplete="off" />
      <button id="enviar">Enviar</button>
    </div>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    const escapar = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    function burbuja(quien, texto) {
      const div = document.createElement('div');
      div.className = `burbuja ${quien}`;
      div.innerHTML = `<span class="quien">${quien}</span>${escapar(texto)}`;
      $('#charla').appendChild(div);
      $('#charla').scrollTop = $('#charla').scrollHeight;
    }

    const flujo = new EventSource('/api/simulador/eventos');
    flujo.addEventListener('salida', (evento) => {
      const salida = JSON.parse(evento.data);
      if (salida.telefono === $('#telefono').value.trim()) burbuja('bot', salida.texto);
    });

    async function enviar(texto) {
      const mensaje = (texto ?? $('#mensaje').value).trim();
      if (!mensaje) return;
      burbuja('cliente', mensaje);
      $('#mensaje').value = '';
      await fetch('/api/simulador/mensaje', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ telefono: $('#telefono').value.trim(), texto: mensaje }),
      });
    }

    $('#enviar').addEventListener('click', () => enviar());
    $('#mensaje').addEventListener('keydown', (e) => { if (e.key === 'Enter') enviar(); });
    document.querySelectorAll('.sugerencias button').forEach((b) =>
      b.addEventListener('click', () => enviar(b.textContent)));
  </script>
</body>
</html>
